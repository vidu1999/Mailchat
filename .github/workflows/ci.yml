name: CI

# Runs analysis, tests and builds a debug APK artifact on every push and PR.
# The APK is unsigned (debug-signed) and is NOT a Play Store release — see
# docs/release.md for signing and release steps.

permissions:
  contents: read
  # Needed to publish analyzer findings as a check run (see below).
  checks: write

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter create` writes a template test that references a `MyApp`
      # widget this project does not have. The repo ships its own
      # test/widget_test.dart, so drop any template copy.
      - name: Remove generated template test
        run: |
          if grep -qs "class MyApp\|package:mailchat/main.dart" test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi

      # Print the toolchain: analysis results depend on the SDK version, and a
      # failure is otherwise impossible to reproduce from the log alone.
      - name: Toolchain versions
        run: flutter --version

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # `pipefail` keeps the analyzer's exit code now that output is tee'd.
      # `--no-pub` reuses the resolution from the install step above.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log

      # The tool scripts are part of the product: a broken checker would block
      # every build. Exercise them against the shipped template — the check must
      # fail (exit 1) because the template holds placeholders.
      - name: Smoke-test the tooling
        run: |
          # Neither .env nor assets/config/env exists in a fresh checkout, so the
          # checker must fail loudly rather than approve a build with no config.
          set +e
          dart run tool/check_config.dart --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::check_config.dart should fail when no config is present (got exit $rc)"
            exit 1
          fi
          echo "check_config correctly failed with no configuration"

          # And a root .env must be picked up, copied into the asset, and then
          # rejected for holding the service-role key.
          cp .env.example .env
          set +e
          dart run tool/check_config.dart --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::the template's placeholders should still be rejected (got exit $rc)"
            exit 1
          fi
          test -f assets/config/env || { echo "::error::.env was not copied to assets/config/env"; exit 1; }
          echo "check_config read .env, synced it, and rejected the placeholders"
          rm -f .env assets/config/env"

      # `flutter test` reports only the exit code in the step summary, so keep
      # the output for the publish steps below.
      - name: Run unit & widget tests
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      # These must come *after* the steps whose output they publish: a step
      # guarded by `if: failure()` is skipped when nothing has failed yet, so
      # placing them earlier silently published nothing.
      - name: Keep analyzer and test output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      # One plain step per file: a multi-line shell function here was rejected
      # when the workflow loaded (the run failed with zero jobs).
      - name: Publish analyzer findings
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s analyze.log ]; then
            jq -Rs --arg sha "$GITHUB_SHA" '{name: "analyze-findings", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "flutter analyze", summary: "Analyzer findings from the failing Analyze step", text: .}}' analyze.log > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json > /dev/null || true
          else
            echo "analyze.log is empty or missing"
          fi

      - name: Publish test findings
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s test.log ]; then
            jq -Rs --arg sha "$GITHUB_SHA" '{name: "test-findings", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "flutter test", summary: "Test output from the failing test step", text: .}}' test.log > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json > /dev/null || true
          else
            echo "test.log is empty or missing"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The repository intentionally does not commit generated platform
      # folders, so they are scaffolded here. Run the same command once locally
      # and commit `android/` (and `ios/`) before shipping a signed release.
      - name: Scaffold Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mailchat --project-name mailchat .
          fi

      # Adds the intent filter and link forwarding that Supabase's auth
      # redirect needs. Idempotent, and required for the build to match a
      # developer machine (see tool/enable_deep_links.dart).
      - name: Enable deep links
        run: dart run tool/enable_deep_links.dart

      # Split per ABI: a fat debug APK bundles the engine for every
      # architecture (100-200 MB). Splitting keeps artifacts small enough to
      # install on a phone with limited free space.
      - name: Build debug APKs
        run: |
          flutter build apk --debug --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mailchat-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
