name: CI

# Runs analysis, tests and builds a debug APK artifact on every push and PR.
# The APK is unsigned (debug-signed) and is NOT a Play Store release — see
# docs/release.md for signing and release steps.

permissions:
  contents: read
  # Needed to publish analyzer findings as a check run (see below).
  checks: write

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter create` writes a template test that references a `MyApp`
      # widget this project does not have. The repo ships its own
      # test/widget_test.dart, so drop any template copy.
      - name: Remove generated template test
        run: |
          if grep -qs "class MyApp\|package:mailchat/main.dart" test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi

      # Print the toolchain: analysis results depend on the SDK version, and a
      # failure is otherwise impossible to reproduce from the log alone.
      - name: Toolchain versions
        run: flutter --version

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # `pipefail` keeps the analyzer's exit code now that output is tee'd.
      # `--no-pub` reuses the resolution from the install step above.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log

      # A failing analyze step otherwise shows only "exit code 1"; the findings
      # live in the log, so keep it as an artifact and — so the findings are
      # readable from the API without downloading anything — as a check run.
      - name: Keep analyzer output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      - name: Publish analyzer findings
        if: failures() && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            local name="$1" file="$2" title="$3"
            if [ ! -s "$file" ]; then
              echo "$file is empty or missing"
              return 0
            fi
            jq -Rs --arg sha "$GITHUB_SHA" --arg name "$name" --arg title "$title" \
              '{name: $name, head_sha: $sha, status: "completed",
                conclusion: "neutral",
                output: {title: $title, summary: $title, text: .}}' \
              "$file" > "payload-$name.json"
            gh api "repos/${{ github.repository }}/check-runs" --input "payload-$name.json" > /dev/null
          }
          publish "analyze-findings" analyze.log "flutter analyze" || true
          publish "test-findings" test.log "flutter test" || true

      # Same treatment as the analyzer: `flutter test` reports only the exit
      # code in the step summary, so keep the output and publish it.
      - name: Run unit & widget tests
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The repository intentionally does not commit generated platform
      # folders, so they are scaffolded here. Run the same command once locally
      # and commit `android/` (and `ios/`) before shipping a signed release.
      - name: Scaffold Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mailchat --project-name mailchat .
          fi

      # Adds the intent filter and link forwarding that Supabase's auth
      # redirect needs. Idempotent, and required for the build to match a
      # developer machine (see tool/enable_deep_links.dart).
      - name: Enable deep links
        run: dart run tool/enable_deep_links.dart

      # Split per ABI: a fat debug APK bundles the engine for every
      # architecture (100-200 MB). Splitting keeps artifacts small enough to
      # install on a phone with limited free space.
      - name: Build debug APKs
        run: |
          flutter build apk --debug --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mailchat-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
