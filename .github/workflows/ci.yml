name: CI

# Runs analysis, tests and builds a debug APK artifact on every push and PR.
# The APK is unsigned (debug-signed) and is NOT a Play Store release — see
# docs/release.md for signing and release steps.

permissions:
  contents: read
  # Needed to publish analyzer findings as a check run (see below).
  checks: write

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter create` writes a template test that references a `MyApp`
      # widget this project does not have. The repo ships its own
      # test/widget_test.dart, so drop any template copy.
      - name: Remove generated template test
        run: |
          if grep -qs "class MyApp\|package:mailchat/main.dart" test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi

      # Print the toolchain: analysis results depend on the SDK version, and a
      # failure is otherwise impossible to reproduce from the log alone.
      - name: Toolchain versions
        run: flutter --version

      # flutter_webrtc needs Flutter >= 3.35 (its Java uses an embedding hook
      # that only exists from 3.29, and it compiles against SDK 36, which 3.35
      # is the first default for). Failing here names the real problem instead
      # of leaving three Java errors forty lines into the Gradle output.
      - name: Check the Flutter SDK is new enough for call media
        run: dart run tool/fix_android_build.dart --check

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # `pipefail` keeps the analyzer's exit code now that output is tee'd.
      # `--no-pub` reuses the resolution from the install step above.
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log

      # The tool scripts are part of the product: a broken checker would block
      # every build. Exercise them against the shipped template — the check must
      # fail (exit 1) because the template holds placeholders.
      - name: Smoke-test the tooling
        run: |
          # Neither .env nor assets/config/env exists in a fresh checkout, so the
          # checker must fail loudly rather than approve a build with no config.
          set +e
          dart run tool/check_config.dart --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::check_config.dart should fail when no config is present (got exit $rc)"
            exit 1
          fi
          echo "check_config correctly failed with no configuration"

          # Migrations are applied by hand in the SQL editor, so a file that is
          # not re-runnable strands the user halfway with 42710.
          dart run tool/check_migrations.dart

          # The documents claim which file implements what. A rename would make
          # those claims false, so every path a document mentions must exist.
          dart run tool/check_docs.dart

          # And a root .env must be picked up and copied into the asset. The
          # template still holds placeholders, so it must still be rejected.
          cp .env.example .env
          set +e
          dart run tool/check_config.dart --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::the template's placeholders should still be rejected (got exit $rc)"
            exit 1
          fi
          test -f assets/config/env || { echo "::error::.env was not copied to assets/config/env"; exit 1; }
          echo "check_config read .env, synced it, and rejected the placeholders"
          rm -f .env assets/config/env

      # `flutter test` reports only the exit code in the step summary, so keep
      # the output for the publish steps below.
      - name: Run unit & widget tests
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      # These must come *after* the steps whose output they publish: a step
      # guarded by `if: failure()` is skipped when nothing has failed yet, so
      # placing them earlier silently published nothing.
      - name: Keep analyzer and test output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      # One plain step per file: a multi-line shell function here was rejected
      # when the workflow loaded (the run failed with zero jobs).
      - name: Publish analyzer findings
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s analyze.log ]; then
            jq -Rs --arg sha "$GITHUB_SHA" '{name: "analyze-findings", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "flutter analyze", summary: "Analyzer findings from the failing Analyze step", text: .}}' analyze.log > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json > /dev/null || true
          else
            echo "analyze.log is empty or missing"
          fi

      - name: Publish test findings
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s test.log ]; then
            jq -Rs --arg sha "$GITHUB_SHA" '{name: "test-findings", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "flutter test", summary: "Test output from the failing test step", text: .}}' test.log > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json > /dev/null || true
          else
            echo "test.log is empty or missing"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The repository intentionally does not commit generated platform
      # folders, so they are scaffolded here. Run the same command once locally
      # and commit `android/` (and `ios/`) before shipping a signed release.
      - name: Scaffold Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mailchat --project-name mailchat .
          fi

      # One step for everything the generated platform folder needs: pin
      # compileSdk to what flutter_webrtc requires, then apply the deep-link
      # intent filter and the camera/microphone permissions. Each part is
      # idempotent, and the same command is the documented local fix.
      - name: Prepare the Android project
        run: dart run tool/fix_android_build.dart

      # The step above scaffolds android/ when it is missing. Running the tool
      # again is the path a developer hits: the folder already exists, so the
      # tool scaffolds a throwaway reference project from the same SDK and must
      # agree that android/ is current. That is the check that turns a stale
      # folder left behind by an older Flutter into one sentence instead of
      # eight minutes of Gradle output ending in "Your project's Gradle version
      # ... is lower than Flutter's minimum supported version".
      - name: Check the generated android/ matches this SDK
        run: |
          set -o pipefail
          dart run tool/fix_android_build.dart 2>&1 | tee /tmp/current.log
          grep -q "android/ is current for this SDK" /tmp/current.log || {
            echo "::error::the existing android/ was not recognised as current"
            exit 1
          }

      # Split per ABI: a fat debug APK bundles the engine for every
      # architecture (100-200 MB). Splitting keeps artifacts small enough to
      # install on a phone with limited free space.
      # Job logs are not readable from every environment (the API redirects to
      # storage that may be blocked), so the tail of a failed build is re-emitted
      # as annotations, which are readable through the checks API.
      - name: Build debug APKs
        run: |
          set +e
          flutter build apk --debug --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            2>&1 | tee /tmp/build-apk.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::flutter build apk failed with exit $rc"
            # Gradle puts the reason after "What went wrong"; the plain tail is
            # mostly SDK-installer noise.
            grep -n -A 25 "What went wrong" /tmp/build-apk.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -nE "^\s*e: |Execution failed for task|Could not resolve|requires|error:" \
              /tmp/build-apk.log | head -25 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$rc"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mailchat-debug-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
