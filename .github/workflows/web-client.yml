name: Web client

# Publishes the browser MailChat at https://vidu1999.github.io/Mailchat/
# GitHub Pages is already enabled for this repository. The artifact is only
# webapp/, so the site root is the app, not the repository.

on:
  push:
    branches: ["arena/**"]
    paths:
      - "webapp/**"
      - "tool/check_web_client.js"
      - ".github/workflows/web-client.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish browser client
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check browser client
        run: node tool/check_web_client.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the public page
        run: |
          python3 - << 'PY'
          import time, urllib.request
          url = "https://vidu1999.github.io/Mailchat/"
          last = "not tried"
          for _ in range(12):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=30) as res:
                      headers = {k.lower(): v for k, v in res.headers.items()}
                      body = res.read(8000).decode("utf-8", "replace")
                  ctype = headers.get("content-type", "")
                  policy = (headers.get("permissions-policy", "") + " " + headers.get("feature-policy", "")).replace(" ", "")
                  ready = "text/html" in ctype and "MailChat" in body and "logic.js" in body
                  print(f"type={ctype!r} policy={policy!r} ready={ready}")
                  if ready and "microphone=()" not in policy:
                      print(f"::notice title=MailChat web::{url}")
                      raise SystemExit(0)
                  last = f"not ready type={ctype!r} policy={policy!r}"
              except SystemExit:
                  raise
              except Exception as exc:
                  last = str(exc)
                  print("wait", last)
              time.sleep(10)
          print(f"::error title=MailChat web::{last}")
          raise SystemExit(last)
          PY
