name: Web client

# Finds a public https address for the browser client. GitHub Pages is enabled,
# but this branch is not allowed to deploy to that environment. A CDN address
# does not need that permission.

on:
  push:
    branches: ["arena/**"]
    paths:
      - "webapp/**"
      - "tool/check_web_client.js"
      - ".github/workflows/web-client.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Check and locate browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check browser client
        run: node tool/check_web_client.js

      - name: Find a public address
        run: |
          python3 - << 'PY'
          import os, time, urllib.request
          sha = os.environ["GITHUB_SHA"]
          candidates = [
              f"https://cdn.jsdelivr.net/gh/vidu1999/Mailchat@{sha}/webapp/index.html",
              f"https://cdn.statically.io/gh/vidu1999/Mailchat/{sha}/webapp/index.html",
              f"https://raw.githack.com/vidu1999/Mailchat/{sha}/webapp/index.html",
          ]
          good = None
          notes = []
          for attempt in range(5):
              notes.append(f"attempt {attempt + 1}")
              for url in candidates:
                  req = urllib.request.Request(url, method="GET")
                  try:
                      with urllib.request.urlopen(req, timeout=45) as res:
                          headers = {k.lower(): v for k, v in res.headers.items()}
                          body = res.read(8000).decode("utf-8", "replace")
                  except Exception as exc:
                      notes.append(f"FAIL {url} {exc}")
                      continue
                  ctype = headers.get("content-type", "")
                  policy = (headers.get("permissions-policy", "") + " " + headers.get("feature-policy", "")).replace(" ", "")
                  mic_blocked = "microphone=()" in policy
                  ok_type = "text/html" in ctype
                  ok_body = "MailChat" in body and "logic.js" in body
                  notes.append(f"{'OK' if ok_type and ok_body and not mic_blocked else 'NO'} {url} type={ctype!r} policy={policy!r}")
                  if ok_type and ok_body and not mic_blocked and good is None:
                      good = url
              if good:
                  break
              time.sleep(12)
          print("\n".join(notes))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Browser client\n\n")
                  fh.write((good or "No public address") + "\n\n")
                  fh.write("```\n" + "\n".join(notes) + "\n```\n")
          if good:
              print(f"::notice title=MailChat web::{good}")
          else:
              print("::error title=MailChat web::" + (notes[-1] if notes else "no address"))
              raise SystemExit("no usable public address")
          PY
