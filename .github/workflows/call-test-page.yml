name: Call test page

# Publishes the browser call test at a real https address. The sandbox preview
# host is not in Cloudflare DNS, so a computer and a phone cannot open it.
# This site is the address they can open instead.

on:
  push:
    branches: ["arena/**"]
    paths:
      - "tool/call_test/**"
      - ".github/workflows/call-test-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: call-test-page
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish call test page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool/call_test

      - id: deployment
        uses: actions/deploy-pages@v4
