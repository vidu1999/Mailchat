name: mailchat
description: >
  MailChat — a professional, secure, real-time messaging application with
  email-based identity. Users register and communicate without phone numbers,
  SMS OTP, or a SIM card. Built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  # flutter_webrtc sets the real floor, and it does not declare it itself (its
  # pubspec says `flutter: ">=1.22.0"`). It needs two things from the SDK:
  #   * the Android embedding's `TextureRegistry.SurfaceProducer.Callback`
  #     `onSurfaceCleanup()` hook — present from 3.29. Before that the equivalent
  #     was an abstract `onSurfaceDestroyed()`, which the plugin does not
  #     implement, so its Java does not compile.
  #   * a default `compileSdk` of 36 — reached in 3.35 (3.32 defaults to 35).
  # 3.35 is therefore the first SDK that satisfies both.
  # Declaring it here means `flutter pub get` fails with a readable message
  # instead of Gradle failing with three Java errors and an SDK warning.
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Picking a photo or a file to send. First-party (flutter/packages) on
  # purpose: it is on the v2 Android embedding and needs no Gradle changes in
  # the scaffolded android/ folder. file_picker was tried first and rejected —
  # 6.x still declares the removed v1 embedding API, and 8.x requires a
  # compileSdk this repository's CI scaffold does not produce.
  file_selector: ^1.0.3
  # Call media: RTCPeerConnection, getUserMedia and the video renderers. The
  # signalling half of calling lives in the database (migration 0007); this is
  # the half that carries the audio and video. Verified against the package's
  # published pubspec: 1.6.x needs Dart >=3.3 and Android minSdk 21, both of
  # which this project already satisfies, so the scaffolded android/ folder
  # needs no Gradle edits — only the runtime permissions, added by
  # tool/enable_call_permissions.dart.
  flutter_webrtc: ^1.6.3
  # Android background OS notifications (FCM); secrets stay in the trusted
  # Supabase Edge Function, never in the client app.
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  # Android action buttons and grouped Inbox-style notifications.
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Runtime configuration. Declared as a directory: `env` is gitignored and
    # absent in CI, which must still build (it falls back to --dart-define).
    - assets/config/
